[package]
name = "sgdb-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "All logic for the SteamGridDB artwork manager. No Tauri, no anyhow."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# rustls rather than native-tls: no OpenSSL/schannel build dependency, and the Linux CI leg
# builds this crate too. `json` is unused on purpose -- responses are read as text so the
# content type can be checked first (a wrong path returns an HTML page, not JSON).
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "http2",
] }
tokio = { version = "1", features = ["sync", "time", "net"] }
url = "2"

# The CEF debugger is plain ws:// on loopback, so no TLS. `connect` is the only feature needed.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# Process enumeration for `steam::process`. The registry's ActiveProcess\pid is cleared early
# in shutdown while steam.exe is still alive, so only the process list can answer "is it safe
# to write shortcuts.vdf yet". Already in the tree via Tauri, so this costs no extra build.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    # DPAPI, for encrypting the API key at rest in `settings`.
    "Win32_Security_Cryptography",
    # ShellExecuteW, for opening an allowlisted link in the default browser. A Tauri webview
    # ignores `target="_blank"`, so the backend has to hand the URL to the OS.
    #
    # `Win32_UI_WindowsAndMessaging` is not optional here: ShellExecuteW is gated behind it,
    # because its last parameter is a `SHOW_WINDOW_CMD` that lives in that module.
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
# The SGDB client is tested against a local mock rather than the live API: 429/backoff, the
# HTML-404 case and "no auth header on the CDN" are all impractical to provoke for real.
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Spike-only, for `examples/cdp_probe.rs`. No TLS: the CEF debugger is plain ws:// on
# loopback. When the CDP client is promoted out of the example this moves to [dependencies].
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

[lints]
workspace = true
