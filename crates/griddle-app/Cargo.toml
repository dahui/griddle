[package]
name = "griddle-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Desktop shell. Thin — all logic lives in griddle-core."
# An app internal, not a library for anyone else. Also how `about.toml` tells our own crates
# apart from the third parties it has to attribute.
publish = false

[dependencies]
griddle-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["sync"] }
# Shared with griddle-core's client so there is one connection pool, and so the CDP discovery and
# the SteamGridDB client cannot disagree about timeouts.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# `protocol-asset` renders existing artwork straight from Steam's `grid/` directory. The scope
# is granted at runtime in main.rs to exactly one directory, because the path depends on the
# install and account id. Tauri validates that the feature and the config agree, so
# `assetProtocol` in tauri.conf.json must stay in step with this.
tauri = { version = "2.11.5", features = ["protocol-asset"] }

# 🔴 Load-bearing, and easy to lose.
#
# `custom-protocol` is what makes a build serve the frontend from `frontendDist` (embedded in
# the exe) instead of from `build.devUrl`. It is **not** one of tauri's default features, so
# without this section *every* build — debug and release alike — points at
# http://localhost:1420 and shows a connection-refused page unless a Vite dev server happens
# to be running.
#
# `tauri build` passes `--features custom-protocol` automatically; a hand-rolled
# `cargo build --release` must pass it too. That asymmetry is why the release binary looked
# fine (it started, the window titled correctly) while rendering nothing.
# It is in `default` on purpose, which the stock Tauri template does not do. The template
# leaves it opt-in and relies on `tauri build` adding `--features custom-protocol`, so a plain
# `cargo build --release` silently produces a binary that renders a connection-refused page.
# `tauri dev` passes `--no-default-features`, so making it default keeps hot-reload working
# while making the obvious command correct.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
