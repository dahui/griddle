name: CI

on:
  push:
  pull_request:

# Read-only by default. The release workflow is the only one that needs write access, and it
# asks for it explicitly.
permissions:
  contents: read

# Superseded pushes to the same branch are cancelled. Safe here in a way it is not for Pages:
# nothing is published, so a cancelled run leaves nothing half-done.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs first and on every platform-independent path: a leaked secret should fail loudly
  # within seconds, not after a ten-minute build. Also the reason this is a separate job —
  # the pre-commit hook needs `git config core.hooksPath .githooks`, which a fresh clone will
  # not have, so CI must not rely on it.
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan tracked files
        run: sh scripts/check-secrets.sh --all
      # A secret removed in a later commit is still a leaked secret. This is the same script,
      # not a reimplementation — an inlined copy here previously held a key literal and
      # tripped the tree scan.
      - name: Scan full history
        run: sh scripts/check-secrets.sh --history

  boundaries:
    name: architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # One script, run identically by CI and scripts/gate.ps1 — an inline copy here drifted
      # from the local check once already, and its write-boundary grep flagged test fixtures
      # written to temp directories, which trains people to ignore the check.
      - name: architecture boundaries
        run: sh scripts/check-boundaries.sh
      # Byte-level, with the bad sequences written as hex escapes -- an inline
      # pattern containing literal mojibake was itself corrupted once.
      - name: encoding
        run: python3 scripts/check-encoding.py

  # Griddle ships under Apache-2.0, which says nothing about the crates statically linked into
  # the binary. MIT and BSD require their notices travel with the code we redistribute, and one
  # MPL-2.0 crate requires a pointer to its source. An out-of-date notices file looks completely
  # normal, so this is the only thing that can catch it.
  #
  # Runs on Windows, which is not incidental. The file is regenerated by `scripts/notices.ps1`
  # on a maintainer's machine, and the product is Windows-only, so that is always a Windows
  # machine. Checked on ubuntu it disagreed with a byte-identical local run — the same
  # cargo-about version, the same lockfile, the same `targets` pin in about.toml — leaving a
  # guard nobody could reproduce or fix locally. Checking where the file is produced is the
  # only version of this that a maintainer can act on.
  notices:
    name: third-party notices
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Pinned: cargo-about's output is this check's expected value, so an upstream release that
      # reformats it would fail here looking exactly like an undeclared dependency.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.1
      # Regenerate and diff. `about.toml` also fails on a dependency whose licence is not on its
      # accepted list, so a new copyleft dependency stops here rather than shipping.
      - name: Check notices are current
        shell: pwsh
        run: ./scripts/notices.ps1 -Check

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Tauri needs system webkit/gtk on Linux; griddle-core does not, so only that crate is
      # exercised on ubuntu. The point of the Linux leg is catching cfg-gated code that only
      # compiles on Windows.
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p griddle-core --all-targets -- -D warnings
      - run: cargo test -p griddle-core

      # `tauri::generate_context!` reads `frontendDist` at *compile* time and panics if the
      # directory is absent, so even linting griddle-app needs a built frontend. Nothing in this
      # job would otherwise produce one -- `cargo clippy` never runs `beforeBuildCommand` -- and
      # the panic names the missing path rather than the missing build step, which reads as a
      # broken config.
      - uses: oven-sh/setup-bun@v2
        if: matrix.os == 'windows-latest'
      # Two steps rather than one `run:` block: pwsh reports only the last command's exit code,
      # so a failed install inside a combined step would be reported as a frontend build failure.
      - name: Install frontend dependencies (Windows only)
        if: matrix.os == 'windows-latest'
        run: bun install --frozen-lockfile
      - name: Build the frontend (Windows only)
        if: matrix.os == 'windows-latest'
        run: bun run build:desktop
      - name: Build the app shell (Windows only)
        if: matrix.os == 'windows-latest'
        run: cargo clippy -p griddle-app --all-targets -- -D warnings
      # `clippy --all-targets` compiles the tests but never runs them, so griddle-app's tests had
      # never executed anywhere -- not here, not in the local gate. Linting a test is not the
      # same as running it.
      - name: Test the app shell (Windows only)
        if: matrix.os == 'windows-latest'
        run: cargo test -p griddle-app

  js:
    name: typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck

  # The release path, exercised on every push rather than first attempted at a tag.
  #
  # Everything here is specific to producing a shippable binary and none of it is covered by the
  # jobs above: `cargo clippy` never builds the frontend, never links a release binary, and never
  # runs the bundler. Before this job existed the whole thing was untested until the moment it
  # mattered.
  package:
    name: release build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # A version is stamped even though nothing is published, because `set-version.ps1` is part
      # of the release path too -- and its failure mode is a pattern that silently matches
      # nothing. Any manifest that changes shape fails here instead of at a tag.
      - name: Stamp a dummy version
        shell: pwsh
        run: ./scripts/set-version.ps1 0.0.0-ci

      # Both artifacts, from one build. This also covers the trap that `cargo build` alone does
      # not run `beforeBuildCommand`, so it would embed whatever was last in `apps/desktop/dist`.
      - name: Build installer and binary
        run: bun run --cwd crates/griddle-app tauri build

      - name: Check the artifacts exist
        shell: pwsh
        run: |
          $exe = 'target/release/griddle-app.exe'
          if (-not (Test-Path $exe)) { throw "no binary at $exe" }
          if (-not (Get-ChildItem target/release/bundle/nsis/*-setup.exe)) { throw "no NSIS installer" }

          # PE subsystem 2 is WINDOWS_GUI. At 3 (CONSOLE) a console window flashes on every
          # launch -- the exact wart this project exists to remove, and invisible in CI unless
          # it is asserted. Read from the PE header: e_lfanew at 0x3C, then +0x5C into the
          # optional header.
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 0x5C)
          if ($subsystem -ne 2) { throw "PE subsystem is $subsystem, expected 2 (WINDOWS_GUI)" }
          Write-Host "PE subsystem 2 (WINDOWS_GUI), installer present"
