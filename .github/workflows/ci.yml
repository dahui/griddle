name: CI

on:
  push:
  pull_request:

jobs:
  # Runs first and on every platform-independent path: a leaked secret should fail loudly
  # within seconds, not after a ten-minute build. Also the reason this is a separate job —
  # the pre-commit hook needs `git config core.hooksPath .githooks`, which a fresh clone will
  # not have, so CI must not rely on it.
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked files
        run: sh scripts/check-secrets.sh --all
      # A secret removed in a later commit is still a leaked secret. This is the same script,
      # not a reimplementation — an inlined copy here previously held a key literal and
      # tripped the tree scan.
      - name: Scan full history
        run: sh scripts/check-secrets.sh --history

  boundaries:
    name: architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sgdb-core must not depend on tauri or anyhow
        run: |
          if grep -nE '^\s*(tauri|anyhow)\s*=' crates/sgdb-core/Cargo.toml; then
            echo "::error::sgdb-core must stay free of tauri/anyhow — all logic is headless"
            exit 1
          fi
      - name: only sanctioned modules may write files
        run: |
          # This project's failure mode is corrupting a user's irreplaceable Steam config.
          # Keep the write surface small enough to audit by grep.
          violations=$(grep -rnE 'fs::write|File::create|remove_file|remove_dir' \
            crates/sgdb-core/src \
            --include='*.rs' \
            | grep -vE 'src/(grid/store|steam/shortcuts|settings)\.rs' || true)
          if [ -n "$violations" ]; then
            echo "::error::file writes outside grid::store / steam::shortcuts / settings"
            echo "$violations"
            exit 1
          fi
          echo "write boundary respected"
      - name: steam://flushconfig is banned
        run: |
          # It has historically made Steam forget its library folder locations.
          #
          # Match the URL, then drop comment lines. The rule is *documented* in
          # sgdb-core/src/lib.rs, so both a naive `grep flushconfig` and a quote-anchored
          # pattern fail on the very comment that forbids it (the doc uses a markdown code
          # span, whose backticks look exactly like a JS template literal). Both mistakes
          # were made writing this; hence the comment filter.
          hits=$(grep -rn 'steam://flushconfig' \
                   --include='*.rs' --include='*.ts' --include='*.tsx' \
                   crates packages apps 2>/dev/null \
                 | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|\*|#)' || true)
          if [ -n "$hits" ]; then
            echo "::error::steam://flushconfig is banned — it can make Steam forget its library folders"
            echo "$hits"
            exit 1
          fi
          echo "clean"

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Tauri needs system webkit/gtk on Linux; sgdb-core does not, so only that crate is
      # exercised on ubuntu. The point of the Linux leg is catching cfg-gated code that only
      # compiles on Windows.
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p sgdb-core --all-targets -- -D warnings
      - run: cargo test -p sgdb-core
      - name: Build the app shell (Windows only)
        if: matrix.os == 'windows-latest'
        run: cargo clippy -p sgdb-app --all-targets -- -D warnings

  js:
    name: typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
