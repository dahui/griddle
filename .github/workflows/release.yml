name: Release

# Pushing a tag is the entire release action. Nothing in the repository carries a version between
# releases -- every manifest reads 0.0.0 on main and this job stamps the tag in before building,
# so the four files cannot drift apart.
on:
  push:
    tags: ['v*']
  # For re-running a release whose upload failed, without moving the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Split out and run first: a malformed tag must fail in seconds, before a ten-minute
      # build, and must never produce a GitHub release named after a typo.
      - name: Validate the tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          if ($tag -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') {
              Write-Host "::error::'$tag' is not a valid release tag. Expected v<major>.<minor>.<patch>[-prerelease]."
              exit 1
          }
          $version = $Matches[1]
          # A suffix means a pre-release. GitHub then keeps it off the "Latest release" badge
          # and out of the /releases/latest redirect the README download link uses.
          $prerelease = if ($version -match '-') { 'true' } else { 'false' }
          "version=$version"       >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          Write-Host "building $version (prerelease: $prerelease)"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Stamp the version
        shell: pwsh
        run: ./scripts/set-version.ps1 ${{ steps.version.outputs.version }}

      # One build produces both artifacts. `tauri build` runs `beforeBuildCommand`, so the
      # frontend is always rebuilt from source here -- a bare `cargo build --release` would
      # happily embed a stale `apps/desktop/dist` and the result looks completely correct: it
      # compiles, starts, and titles its window.
      - name: Build
        run: bun run --cwd crates/griddle-app tauri build

      - name: Assemble the artifacts
        id: assemble
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force artifacts | Out-Null

          # Every artifact is checked against the version resource it carries, because the whole
          # class of failure here is *shipping the wrong file under the right name* -- and a
          # correctly-named copy of the wrong build passes every other check there is.
          function Assert-Version($path, $expected) {
              $stamped = (Get-Item $path).VersionInfo.ProductVersion
              if ($stamped -ne $expected) {
                  throw "$path reports version '$stamped', expected '$expected'"
              }
          }

          # Renamed from griddle-app.exe: the crate name is an implementation detail and the
          # product is called Griddle. The installer already does this rename itself.
          $staging = "staging/Griddle"
          New-Item -ItemType Directory -Force $staging | Out-Null
          Assert-Version target/release/griddle-app.exe $version
          Copy-Item target/release/griddle-app.exe "$staging/Griddle.exe"
          # Apache-2.0 section 4 requires LICENSE and NOTICE travel with every distribution, and
          # the crates linked into the exe require their own notices. A zip is a distribution.
          Copy-Item LICENSE, NOTICE, THIRD-PARTY-NOTICES.txt, README.md $staging

          $portable = "artifacts/Griddle-$version-portable.zip"
          Compress-Archive -Path "$staging/*" -DestinationPath $portable

          # Pinned to the exact filename the version stamp produces -- never "the first match".
          #
          # This shipped broken once. `Get-ChildItem *-setup.exe | Select-Object -First 1` sorts
          # ASCII-ascending, so a stale bundle left in `target/` by an earlier build wins:
          # `Griddle_0.0.0_x64-setup.exe` sorts ahead of `Griddle_1.1.0_x64-setup.exe`, and the
          # release then carries a months-old installer under the new version's name. `tauri
          # build` does not clean this directory, and `Swatinem/rust-cache` can restore it, so
          # "the checkout is fresh" is not the protection it looks like.
          #
          # The tell was ugly: the portable zip is built from `target/release/griddle-app.exe`
          # directly, so it was correct, and only the installer was old. That reads as "the build
          # embedded old code" rather than as a file-picking bug.
          $setupName = "Griddle_${version}_x64-setup.exe"
          $setup = "target/release/bundle/nsis/$setupName"
          if (-not (Test-Path $setup)) { throw "no NSIS installer at $setup" }
          Copy-Item $setup "artifacts/$setupName"
          Assert-Version "artifacts/$setupName" $version

          # Written with names relative to the artifacts directory so `sha256sum -c` works after
          # downloading them into one folder.
          Push-Location artifacts
          # `Get-ChildItem -Exclude` is silently EMPTY unless the path carries a contents
          # wildcard (`.\*`) -- it is documented as "effective only when the command includes
          # the contents of an item", and returning nothing is how that ineffectiveness shows
          # up. This is what broke the first release: the loop ran over no files, `Set-Content`
          # with an empty pipeline does not create a file at all, and the failure surfaced two
          # lines later as a missing SHA256SUMS.txt with nothing pointing at the real cause.
          # `Where-Object` has no such rule and cannot be half-written.
          $files = Get-ChildItem -File | Where-Object Name -ne 'SHA256SUMS.txt'
          # The build steps above already throw if they produce nothing, so this is the last
          # line of defence rather than the first -- but an empty artifacts directory must fail
          # here, loudly, and not go on to publish a release advertising files that do not exist.
          if (-not $files) { throw "no artifacts to checksum" }
          $files | ForEach-Object {
              $h = (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower()
              "$h  $($_.Name)"
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          Pop-Location

      # Uploaded before the release is published, so a failed upload does not leave a release
      # advertising artifacts that are not there.
      - uses: actions/upload-artifact@v7
        with:
          name: griddle-${{ steps.version.outputs.version }}
          path: artifacts/*

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Griddle ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: artifacts/*
          # Every release body repeats the SmartScreen warning. Users meet it before they read
          # any documentation, and an unexplained "Windows protected your PC" is where a download
          # gets abandoned.
          body: |
            ## Download

            - **`Griddle-${{ steps.version.outputs.version }}-portable.zip`** — unzip and run. Nothing is installed.
            - **`Griddle_${{ steps.version.outputs.version }}_x64-setup.exe`** — installer, with a Start menu entry and an uninstaller.

            > [!NOTE]
            > **Windows will show "Windows protected your PC" the first time you run this.**
            > Griddle is unsigned, and SmartScreen flags anything it has not seen widely run.
            > Click **More info → Run anyway**; Windows remembers.

            Verify your download against `SHA256SUMS.txt`:
            ```powershell
            Get-FileHash .\Griddle-${{ steps.version.outputs.version }}-portable.zip -Algorithm SHA256
            ```

            [Documentation](https://dahui.github.io/griddle/) · [Installing](https://dahui.github.io/griddle/start/install/)

            ---
